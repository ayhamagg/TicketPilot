services:
  database:
    image: postgres:15
    container_name: ticketpilot_db
    environment:
      POSTGRES_USER: ticketpilot
      POSTGRES_PASSWORD: ticketpilot123
      POSTGRES_DB: ticketpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: